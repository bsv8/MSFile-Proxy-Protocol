<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MSFile · 公共内容索引</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="MSFile 公共内容索引首页">
        <span class="brand-mark" aria-hidden="true">MS</span>
        <span class="brand-name">MSFile</span>
      </a>
      <div class="service-label">
        <span class="service-dot" aria-hidden="true"></span>
        公共内容服务
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">PUBLIC CONTENT INDEX</p>
        <h1 id="page-title">查找可用内容</h1>
        <p class="hero-copy">按文件名或 Seed Hash 前缀检索已完成索引的文件，打开详情即可下载。</p>
      </section>

      <section class="index-section" aria-labelledby="index-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker">CONTENT INDEX</p>
            <h2 id="index-title">内容索引</h2>
          </div>
          <p class="result-count" id="result-count" aria-live="polite">加载中…</p>
        </div>

        <form class="filters" id="filters">
          <label class="search-box">
            <span class="sr-only">搜索文件名或 Seed Hash</span>
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="q" type="search" placeholder="搜索文件名或 Seed Hash 前缀" autocomplete="off">
            <button class="search-submit" type="submit">搜索</button>
          </label>
          <button class="button button-secondary" id="btn-refresh" type="button">刷新列表</button>
        </form>

        <div class="table-wrap">
          <table class="table" id="file-table">
            <thead>
              <tr>
                <th>Seed Hash（内容唯一标识）</th>
                <th>文件名</th>
                <th>类型</th>
                <th>大小</th>
                <th>状态</th>
                <th><span class="sr-only">操作</span></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="pager">
          <button class="button button-secondary" id="btn-prev" type="button">上一页</button>
          <span id="page-info" aria-live="polite"></span>
          <button class="button button-secondary" id="btn-next" type="button">下一页</button>
        </div>
      </section>

      <section class="detail-section" id="detail-panel" aria-labelledby="detail-title" hidden>
        <div class="detail-topline">
          <div>
            <p class="section-kicker">FILE DETAIL</p>
            <h2 id="detail-title">文件详情</h2>
          </div>
          <button class="button button-secondary" id="btn-close-detail" type="button">关闭</button>
        </div>

        <div class="detail-intro">
          <div>
            <p class="detail-label">文件名</p>
            <h3 id="detail-filename">-</h3>
            <code class="detail-hash" id="detail-hash" title="完整 Seed Hash"></code>
          </div>
          <a class="download-button" id="btn-download" href="#" download>
            <span>下载文件</span>
            <span class="download-arrow" aria-hidden="true">↓</span>
          </a>
        </div>

        <dl class="metadata">
          <div>
            <dt>文件名</dt>
            <dd id="detail-filename-meta">-</dd>
          </div>
          <div>
            <dt>媒体类型</dt>
            <dd id="detail-type">-</dd>
          </div>
          <div>
            <dt>文件大小</dt>
            <dd id="detail-size">-</dd>
          </div>
          <div>
            <dt>状态</dt>
            <dd><span class="state-ready" id="detail-state">有效，可下载</span></dd>
          </div>
        </dl>
        <p class="detail-note">下载文件名由内容索引中的 filename 字段决定。</p>
      </section>
    </main>

    <footer class="footer">
      <span>MSFile</span>
      <span>内容按 Seed Hash 去重索引，当前仅展示可用文件。</span>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
