# MSFile NAS V1 配置示例（全部字段附中文说明）
#
# 启动方式：
#   msfile-nas --config /etc/msfile-nas.yaml
# 仅校验配置不启动：
#   msfile-nas --config /etc/msfile-nas.yaml --check-config
#
# 硬切换说明：本配置是唯一配置真值；不存在“未配置白名单就允许全部”的隐式回退。

# ───────────────────────── 身份与数据区 ─────────────────────────

# 供应商 32 字节 secp256k1 私钥的 hex 文件路径（必填）。
# 该私钥同时决定 libp2p PeerId 与业务公钥；务必妥善保管，权限建议 0600。
identity_key_file: "/etc/msfile-nas/identity.key"


# 原文件根目录；用户通过 SMB/NFS/WebDAV/FUSE 挂载在这里管理文件。
# 服务只读取其中内容建立索引，绝不改名、移动、删除或重排目录结构。
nas_data: "/mnt/nas"

# 派生数据根目录：保存 MasterSeed、SQLite 索引、临时与回收文件。
# 必须位于 nas_data 之外（两者不能互相嵌套）；整库丢失可从 nas_data 完全重建。
seed_data: "/var/lib/msfile-nas"

# ───────────────────────── 访问控制 ─────────────────────────

# 访问模式，只能显式填写 private 或 public：
#   private → 仅允许下方白名单中的客户端公钥执行 Stat/Read；
#             列表为空等价于拒绝全部客户端（没有 allow-all 回退）。
#   public  → 任何通过 libp2p Noise 身份认证的 secp256k1 客户端都允许；
#             服务端会实施全局连接/并发 Read 上限，防止换公钥绕过限额。
access_mode: private

# private 模式的客户端公钥白名单：每项是 33 字节压缩 secp256k1 公钥的 66 位 hex，
# 首字节必须是 02 或 03。任一非法项都会导致启动失败；加载时自动转小写并去重。
# public 模式下本列表不参与判断。修改后需重启服务生效（V1 不支持热重载）。
public_key_whitelist:
  - "02e9408a2c6b7d1f5c3e9a0b4d8f2a6c1e7b9d3f5a8c0e2b4d6f8a1c3e5b7d9f"

# ───────────────────────── 同步行为 ─────────────────────────

# 周期全量扫描间隔：负责最终一致性；网络挂载丢事件时由此兜底收敛。
full_scan_interval: 10m

# 文件连续安静多久才开始计算 Seed：避免把正在复制的大文件发布成半成品。
file_stable_interval: 3s

# 文件不可见后的派生数据保留时间：保留期内同指纹恢复可直接复用 Seed，
# 超过保留期才清理索引和无引用的派生 Seed（绝不触碰 nas_data 原文件）。
invalid_retention: 24h

# 仅测试/故障注入：MSFile Read 返回前的可取消延迟；正常部署不要配置。
# read_delay: 750ms

# 同时读取原文件并计算 Seed 的 worker 数量（1..32）。
# 默认保守为 1，防止机械硬盘或低端 NAS 被并发读取打满。
hash_workers: 1

# 是否启用文件事件监视器（inotify 等）。默认开启用于快速发现；
# 关闭后仅靠周期全量扫描收敛（诊断与测试用途）。
enable_file_watcher: true

# ───────────────────────── 网络监听 ─────────────────────────

# WebRTC Direct 对外公布的公网 UDP 基础地址。
# 这里只填写公网 IP/DNS、UDP 端口和 /webrtc-direct；禁止手工填写 /certhash 或 /p2p。
# 服务启动后使用当前 host 的运行时 certhash 与 PeerId 自动补齐完整地址。
# DNS 不会在启动时解析，也不会自动判断 Cloudflare 是否为橙云；请使用能直接到达 NAS
# UDP 端口的公网 IP 或 DNS-only 名称。
webrtc_direct_public_addresses:
  - "/dns4/direct-nas.example.com/udp/4001/webrtc-direct"
  # 也可以使用公网 IPv4/IPv6：
  # - "/ip4/203.0.113.10/udp/4001/webrtc-direct"

# libp2p 监听 multiaddr 列表：这是 NAS 进程在本机真正绑定的 transport 地址。
# 普通 Web 与 libp2p WS/WSS 必须写在同一个 TCP listener 上，由 WebSocket transport
# 根据是否 HTTP Upgrade 分流：非 Upgrade 交给 Web Handler，Upgrade 进入 libp2p。
#
# 形态 A（本例启用）：同机 Nginx/Caddy 在公网 443 终止 TLS，再透传到 NAS 的 loopback 4002。
# 反向代理必须把 https://nas.example.com:443 转发到 http://127.0.0.1:4002。
#   /ip4/0.0.0.0/udp/4001/webrtc-direct   WebRTC Direct 公网 UDP listener
#   /ip4/127.0.0.1/tcp/4002/ws            反向代理后的源站 WS listener
#
# 形态 B（不要与形态 A 同时启用）：NAS 自己在 443 终止 Full (Strict) 源站 TLS。
# 此时代理不能再占用同一网络命名空间的 443：
#   /ip4/0.0.0.0/tcp/443/tls/ws            NAS 直接终止 TLS 的 WSS listener
listen:
  - "/ip4/0.0.0.0/udp/4001/webrtc-direct"
  - "/ip4/127.0.0.1/tcp/4002/ws"

# 如果选择形态 B，请把上面的 TCP 行替换为下面三行，并同时配置证书与私钥：
# transport 是否启用 TLS 由 listen 中的 multiaddr 显式决定，证书不会隐式升级裸 WS。
# TLS 不替代 Noise 与 PeerId 校验。
#listen:
#  - "/ip4/0.0.0.0/udp/4001/webrtc-direct"
#  - "/ip4/0.0.0.0/tcp/443/tls/ws"
#tls_cert_file: "/etc/msfile-nas/tls.crt"
#tls_key_file: "/etc/msfile-nas/tls.key"

# ───────────────────────── Web 公共内容索引 ─────────────────────────
# 仅 access_mode: public 提供 Web 文件列表、详情和下载；private 白名单模式自动关闭。

# 已弃用的旧版 host:port 字段：保留只是为了让旧 YAML 可加载，不创建 listener，
# 也不参与端口或安全校验。实际绑定和 Web/API 入口只由 listen 决定；新配置可删除。
#admin_listen: "127.0.0.1:4002"

# 兼容运维 API（/api/status、/api/scans）的 Bearer Token；共享入口为非 loopback 时必填。
# 为空表示运维 API 禁用（始终返回 401）；仅 access_mode: public 时提供公共内容索引、详情和下载，且不需要此 token。
# token 不是 MSFile 客户端凭据。
admin_token: "请替换为足够长的随机字符串"
