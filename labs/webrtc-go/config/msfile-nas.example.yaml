# MSFile NAS V1 配置示例（全部字段附中文说明）
#
# 启动方式：
#   msfile-nas --config /etc/msfile-nas.yaml
# 仅校验配置不启动：
#   msfile-nas --config /etc/msfile-nas.yaml --check-config
#
# 硬切换说明：本配置是唯一配置真值；不存在“未配置白名单就允许全部”的隐式回退。

# ───────────────────────── 身份与数据区 ─────────────────────────

# 供应商 32 字节 secp256k1 私钥的 hex 文件路径（必填）。
# 该私钥同时决定 libp2p PeerId 与业务公钥；务必妥善保管，权限建议 0600。
identity_key_file: "/etc/msfile-nas/identity.key"


# 原文件根目录；用户通过 SMB/NFS/WebDAV/FUSE 挂载在这里管理文件。
# 服务只读取其中内容建立索引，绝不改名、移动、删除或重排目录结构。
nas_data: "/mnt/nas"

# 派生数据根目录：保存 MasterSeed、SQLite 索引、临时与回收文件。
# 必须位于 nas_data 之外（两者不能互相嵌套）；整库丢失可从 nas_data 完全重建。
seed_data: "/var/lib/msfile-nas"

# ───────────────────────── 访问控制 ─────────────────────────

# 访问模式，只能显式填写 private 或 public：
#   private → 仅允许下方白名单中的客户端公钥执行 Stat/Read；
#             列表为空等价于拒绝全部客户端（没有 allow-all 回退）。
#   public  → 任何通过 libp2p Noise 身份认证的 secp256k1 客户端都允许；
#             服务端会实施全局连接/并发 Read 上限，防止换公钥绕过限额。
access_mode: private

# private 模式的客户端公钥白名单：每项是 33 字节压缩 secp256k1 公钥的 66 位 hex，
# 首字节必须是 02 或 03。任一非法项都会导致启动失败；加载时自动转小写并去重。
# public 模式下本列表不参与判断。修改后需重启服务生效（V1 不支持热重载）。
public_key_whitelist:
  - "02e9408a2c6b7d1f5c3e9a0b4d8f2a6c1e7b9d3f5a8c0e2b4d6f8a1c3e5b7d9f"

# ───────────────────────── 同步行为 ─────────────────────────

# 周期全量扫描间隔：负责最终一致性；网络挂载丢事件时由此兜底收敛。
full_scan_interval: 10m

# 文件连续安静多久才开始计算 Seed：避免把正在复制的大文件发布成半成品。
file_stable_interval: 3s

# 文件不可见后的派生数据保留时间：保留期内同指纹恢复可直接复用 Seed，
# 超过保留期才清理索引和无引用的派生 Seed（绝不触碰 nas_data 原文件）。
invalid_retention: 24h

# 同时读取原文件并计算 Seed 的 worker 数量（1..32）。
# 默认保守为 1，防止机械硬盘或低端 NAS 被并发读取打满。
hash_workers: 1

# 是否启用文件事件监视器（inotify 等）。默认开启用于快速发现；
# 关闭后仅靠周期全量扫描收敛（诊断与测试用途）。
enable_file_watcher: true

# ───────────────────────── 网络监听 ─────────────────────────

# libp2p 监听 multiaddr 列表，支持：
#   /ip4/0.0.0.0/udp/4001/webrtc-direct   WebRTC Direct（浏览器可直连）
#   /ip4/0.0.0.0/tcp/4002/ws              裸 WS（仅限 loopback 或可信内网）
#   /ip4/0.0.0.0/tcp/4002/tls/ws          WSS（生产公网浏览器必须使用）
listen:
  - "/ip4/0.0.0.0/udp/4001/webrtc-direct"
  - "/ip4/0.0.0.0/tcp/4002/ws"

# 直接终止 TLS 的 WSS 证书与私钥 PEM；两者必须成对出现。
# 注意：transport 是否启用 TLS 由 listen 里的 multiaddr 显式决定——
# 配置证书后，listen 中不允许再出现裸 /ws（请显式写成 /tls/ws），否则启动失败。
# TLS 不替代 Noise 与 PeerId 校验。
#tls_cert_file: "/etc/msfile-nas/tls.crt"
#tls_key_file: "/etc/msfile-nas/tls.key"

# ───────────────────────── Web 管理面 ─────────────────────────

# Web 运维台监听地址。默认只允许 loopback 访问；
# 监听非 loopback 地址时必须同时配置 admin_token，且建议前置可信 TLS。
admin_listen: "127.0.0.1:8080"

# Web 管理 API 的 Bearer Token。所有 /api/* 请求都需要 Authorization: Bearer <token>。
# access_mode=public 不会改变管理面的认证要求；token 不是 MSFile 客户端凭据。
# admin_token: "请替换为足够长的随机字符串"
